services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: stepbro
      POSTGRES_USER: stepbro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U stepbro -d stepbro]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    ports:
      - 127.0.0.1:8000:80
    env_file: ./backend/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: stepbro
      DB_USERNAME: stepbro
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
